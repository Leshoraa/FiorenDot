add_newline = true

format = """
[╭─](10)[](14)\
$os\
[](bg:10 fg:14)\
$directory\
[](fg:10)\
$fill\
$status[─╮](10)
[╰─](10)$character"""

# Right-hand closing line on prompt input
right_format = """[─╯](10)"""

[fill]
symbol = " "

[os]
disabled = false
style = "bg:14 fg:0"
symbols.Arch = "   "

[directory]
style = "bg:10 fg:15"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"
read_only = " 󰌾 "

[directory.substitutions]
"~" = " ~"

[character]
success_symbol = "[❯](bold 14)"
error_symbol = "[❯](bold red)"

# Kapsul status ujung kanan
[status]
disabled = false
style = "bg:10 fg:15"
format = "[](10)[ $symbol ]($style)[](10)"
success_symbol = ""
symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = ""
map_symbol = true

[profiles]
transient = """
[╭─](10)[](14)\
$os\
[](bg:10 fg:14)\
$directory\
[](fg:10)
[╰─](10)$character"""
