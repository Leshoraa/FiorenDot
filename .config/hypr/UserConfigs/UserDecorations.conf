# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 1
  gaps_out = 2
  
  col.active_border = $color10
  col.inactive_border = $color5
}

decoration {
  rounding = 6
         
  active_opacity = 0.89
  inactive_opacity = 0.99
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = false
    range = 4
    render_power = 1

    color =  $color1
    color_inactive = $color11
  }


  blur {
    enabled = true	
    size = 16
    passes = 3
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color13

	groupbar {
		col.active = $color0
  }
}
