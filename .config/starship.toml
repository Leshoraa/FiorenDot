add_newline = true

format = """
[╭─](12)[](13)\
$os\
[](bg:12 fg:13)\
$directory\
[](fg:12)
[╰─](12)$character"""

[os]
disabled = false
style = "bg:13 fg:0"
symbols.Arch = "   "

[directory]
style = "bg:12 fg:15"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"
read_only = " 󰌾 "

[directory.substitutions]
"~" = " ~"

[character]
success_symbol = "[❯](bold 12)"
error_symbol = "[❯](bold red)"