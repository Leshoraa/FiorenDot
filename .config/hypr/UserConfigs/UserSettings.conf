# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

input {
    touchpad {
        disable_while_typing = false
        natural_scroll = false 
        clickfinger_behavior = true
        middle_button_emulation = true
        tap-to-click = true
        drag_lock = 1
    }

    touchdevice {
        enabled = false
        output = eDP-1
    }
    tablet {
        output = eDP-1
    }
}

# Explicitly disable both finger touch and stylus digitizer
device {
    name = wdht1f01:00-2575:0911
    enabled = false
}

device {
    name = wdht1f01:00-2575:0911-stylus
    enabled = false
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
    workspace_swipe_touch = true
}

# Touchpad Multi-Finger Gestures (Hyprland 0.56+)
# 3 Fingers: Workspace Swipe & Desktop Zoom (2x Step Up, Instant Reset Down)
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, ~/.config/hypr/UserScripts/ZoomDesktop.sh in 2.0
gesture = 3, down, dispatcher, exec, ~/.config/hypr/UserScripts/ZoomDesktop.sh reset

# 4 Fingers: Terminal, Scratchpad & Moving Windows
gesture = 4, up, dispatcher, exec, kitty
gesture = 4, down, dispatcher, togglespecialworkspace
gesture = 4, left, dispatcher, movetoworkspace, +1
gesture = 4, right, dispatcher, movetoworkspace, -1

render {
    direct_scanout = 0
}

cursor {
    inactive_timeout = 3
    hide_on_key_press = true
    hide_on_touch = true
}
