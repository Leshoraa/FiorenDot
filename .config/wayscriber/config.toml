# Wayscriber configuration for FiorenDot
config_revision = 3

[ui]
show_onboarding_hints = false
show_capabilities_warning = false
show_toolbar_hint = false
show_floating_badge = false

[ui.toolbar]
show_preset_toasts = false

[keybindings]
exit = ["Escape", "Ctrl+Q"]
clear_canvas = ["E", "C"]
undo = ["Ctrl+Z"]
redo = ["Ctrl+Shift+Z", "Ctrl+Y"]
