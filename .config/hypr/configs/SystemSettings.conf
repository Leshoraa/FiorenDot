# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Default settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf

$scriptsDir = $HOME/.config/hypr/scripts

dwindle {
  #pseudotile = true
  preserve_split = true
  #smart_split = true
  smart_resizing = true
  special_scale_factor = 0.8
}



master {
  new_status = master
  new_on_top = 1
  mfact = 0.5
}

scrolling {
    column_width = 0.5
    direction = right
    fullscreen_on_one_column = true
    follow_focus = true
    wrap_focus = true       
}

monocle {
  # border_width = 0       # Set ke 0 kalau mau monocle bener-bener bersih tanpa border
  # no_gaps_when_only = 1  # Mirip smart gaps, tapi khusus monocle
}

general {
  resize_on_border = true
  layout = dwindle
}

input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300
  
  sensitivity = 0 #mouse sensitivity
  #accel_profile =     # flat or adaptive or blank or EMPTY means libinput’s default mode
  numlock_by_default = false
  left_handed = false
  follow_mouse = 1
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = false 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = 1
  }
  
  # below for devices with touchdevice ie. touchscreen
	touchdevice {
		enabled = true
	}
	
	# below is for table see link above for proper variables
	tablet {
		transform = 0
		left_handed = 0
	}
}


gestures {
  gesture = 3, horizontal, workspace
  workspace_swipe_distance = 250
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 10
  workspace_swipe_cancel_ratio = 0.3
  workspace_swipe_create_new = true 
  workspace_swipe_forever = true

  # 3 Fingers: Overview & Scratchpad
  gesture = 3, up, dispatcher, global, quickshell:overviewToggle
  gesture = 3, down, dispatcher, togglespecialworkspace

  # 4 Fingers: Control Center, App Launcher & Moving Windows
  gesture = 4, up, dispatcher, exec, swaync-client -t -sw
  gesture = 4, down, dispatcher, exec, pkill -x rofi || rofi -show drun
  gesture = 4, left, dispatcher, movetoworkspace, +1
  gesture = 4, right, dispatcher, movetoworkspace, -1
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vrr = 0
  mouse_move_enables_dpms = true
  enable_swallow = off
  swallow_regex = ^(kitty)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = false
  enable_anr_dialog = true    # Application not Responding (ANR)
  anr_missed_pings = 15       # ANR Threshold default 1 is too low
  allow_session_lock_restore = true  # Prevent lockscreen crash when resume from suspend
}

#opengl {
#  nvidia_anti_flicker = true
#}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}

render {
  direct_scanout = 0
}

debug {
  vfr = true 
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors = false # change to 1 if want to disable
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  no_warps = true 
}
