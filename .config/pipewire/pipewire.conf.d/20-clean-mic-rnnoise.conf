# FiorenDot - Clean Mic RNNoise (PipeWire native filter-chain)
# Active automatically when noise-suppression-for-voice (librnnoise_ladspa.so) is installed

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Clean Mic RNNoise"
            media.name       = "Clean Mic RNNoise"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" = 0.0
                        }
                    }
                ]
            }
            audio.position = [ FL FR ]
            capture.props = {
                node.name     = "effect_input.clean_mic"
                target.object = "alsa_input.pci-0000_03_00.6.HiFi__Mic1__source"
                node.passive  = true
            }
            playback.props = {
                node.name        = "effect_output.clean_mic"
                media.class      = "Audio/Source"
                priority.session = 2100
            }
        }
    }
]
