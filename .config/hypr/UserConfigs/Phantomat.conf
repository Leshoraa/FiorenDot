# /* ---- 🌌 Phantomat - Spatial Overview & Zoomable Window Manager 🌌 ---- */

# Load Plugin
plugin = /home/fioren/.local/share/spatial-overview/spatialoverview.so

plugin {
    spatialoverview {
        layout = grid
        scale = 0.36

        # Overview Animations
        animation {
            enabled = true
            speed = 6.0
            bezier = wind
        }

        # Input & Panning (Behavior Infinite Canvas)
        input {
            pan_sensitivity = 1.0
            drag_mode = 1
            touchpad_scroll_factor = 1.0
            drag_threshold = 10
        }

        # Canvas Configuration
        # desktop_mode dan persistent dimatikan agar tidak merusak sistem workspace normal Hyprland
        canvas {
            enabled = true
            desktop_mode = false
            persistent = false
            auto_float = false
            auto_place = false
            initial_zoom = 0.72
            min_zoom = 0.001
            max_zoom = 50.0
            zoom_step = 0.12
            direct_input = true
            hover_focus = true
            minimap_enabled = true
            grid_enabled = false
            grid_style = 1
            remember_layout = false
            viewport_enabled = false
        }

        # Workspace Card Outline
        workspace_outline {
            enabled = false
        }

        # Curved Lens Effect in Overview
        distortion {
            enabled = false
            strength = 0.0
        }
    }
}

# Keybindings
$mainMod = SUPER

# Alt + Tab & Super + Alt + Space: Toggle Spatial Overview
unbind = ALT, tab
bindd = ALT, tab, Toggle Spatial Overview, spatialoverview:overview, toggle all
bindd = $mainMod ALT, space, Toggle Spatial Overview, spatialoverview:overview, toggle all

# Super + Alt + Panah: Navigasi Spasial antar Window (mendarat otomatis di window terdekat)
bindd = $mainMod ALT, left, Navigate Left, spatialoverview:navigate, left
bindd = $mainMod ALT, right, Navigate Right, spatialoverview:navigate, right
bindd = $mainMod ALT, up, Navigate Up, spatialoverview:navigate, up
bindd = $mainMod ALT, down, Navigate Down, spatialoverview:navigate, down

# Continuous Zoom In / Zoom Out on Overview
bindd = $mainMod, equal, Zoom In Overview, spatialoverview:canvas, zoom in
bindd = $mainMod, plus, Zoom In Overview, spatialoverview:canvas, zoom in
bindd = $mainMod, minus, Zoom Out Overview, spatialoverview:canvas, zoom out
bindd = $mainMod, 0, Fit All on Overview, spatialoverview:canvas, fit

# Tidy / Arrange di overview
bindd = $mainMod SHIFT, A, Tidy and arrange windows on grid, spatialoverview:canvas, arrange
