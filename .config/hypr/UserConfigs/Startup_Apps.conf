# Commands and Apps to be executed at launch

# Start virtual keyboard daemon hidden (if enabled)
exec-once = bash -c '[ ! -f "$HOME/.cache/virtual_keyboard_disabled" ] && sleep 3 && $HOME/.local/bin/wvkbd-mobintl -L 300 -H 350 --hidden'

# Pre-warm Kitty terminal server in background for instant launch (~4ms)
exec-once = sleep 1 && kitty -1 --detach --start-as=hidden
