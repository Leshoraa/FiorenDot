# /* ---- 🌌 Phantomat - Spatial Overview & Zoomable Window Manager 🌌 ---- */

# Load Plugin
plugin = /home/fioren/.local/share/spatial-overview/spatialoverview.so

plugin {
    spatialoverview {
        layout = grid
        scale = 0.36

        # Overview Animations
        animation {
            enabled = true
            speed = 6.0
            bezier = wind
        }

        # Canvas Configuration
        # desktop_mode dan persistent dimatikan agar tidak merusak sistem workspace normal Hyprland
        canvas {
            enabled = true
            desktop_mode = false
            persistent = false
            auto_float = false
            auto_place = false
            initial_zoom = 0.72
            min_zoom = 0.05
            max_zoom = 2.5
            zoom_step = 0.12
            direct_input = true
            hover_focus = true
            minimap_enabled = true
            grid_enabled = true
            grid_style = 1
            remember_layout = false
        }

        # Curved Lens Effect in Overview
        distortion {
            enabled = true
            strength = 0.14
        }
    }
}

# Keybindings
$mainMod = SUPER

# Super + Alt + G: Toggle Spatial Overview (Zoom out melihat seluruh window/workspace, ketik untuk cari & mendarat)
bindd = $mainMod ALT, G, Toggle Spatial Overview, spatialoverview:overview, toggle all

# Continuous Zoom In / Zoom Out on Overview
bindd = $mainMod, equal, Zoom In Overview, spatialoverview:canvas, zoom in
bindd = $mainMod, plus, Zoom In Overview, spatialoverview:canvas, zoom in
bindd = $mainMod, minus, Zoom Out Overview, spatialoverview:canvas, zoom out
bindd = $mainMod, 0, Fit All on Overview, spatialoverview:canvas, fit

# Tidy / Arrange di overview
bindd = $mainMod SHIFT, A, Tidy and arrange windows on grid, spatialoverview:canvas, arrange
