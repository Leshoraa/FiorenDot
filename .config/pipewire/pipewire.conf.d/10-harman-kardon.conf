# FiorenDot - Harman Kardon VivoBook Clarity DSP (PipeWire native filter-chain)
# Warm punchy bass + clean 250 Hz separation + vocal/musical clarity + smooth air

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Harman Kardon VivoBook"
            media.name       = "Harman Kardon VivoBook"
            filter.graph = {
                nodes = [
                    # Preamp (-2.0 dB = 0.7943 headroom) + chassis balance (+0.08 => L=0.92, R=1.0)
                    { name = preamp_l type = builtin label = mixer control = { "Gain 1" = 0.7308 } }
                    { name = preamp_r type = builtin label = mixer control = { "Gain 1" = 0.7943 } }

                    # Left channel 9-band Warm Clarity EQ
                    # Protect tiny laptop drivers below resonance, keep bass punchy without 250 Hz mud,
                    # open 2 kHz clarity & smooth 8 kHz air shelf while keeping 4 kHz non-fatiguing
                    { name = eq0_l type = builtin label = bq_peaking   control = { "Freq" = 32.0   "Q" = 1.0 "Gain" = -6.0 } }
                    { name = eq1_l type = builtin label = bq_peaking   control = { "Freq" = 64.0   "Q" = 1.0 "Gain" =  2.5 } }
                    { name = eq2_l type = builtin label = bq_peaking   control = { "Freq" = 125.0  "Q" = 1.1 "Gain" =  4.5 } }
                    { name = eq3_l type = builtin label = bq_peaking   control = { "Freq" = 250.0  "Q" = 1.2 "Gain" =  0.5 } }
                    { name = eq4_l type = builtin label = bq_peaking   control = { "Freq" = 500.0  "Q" = 1.2 "Gain" = -2.0 } }
                    { name = eq5_l type = builtin label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 1.2 "Gain" =  0.5 } }
                    { name = eq6_l type = builtin label = bq_peaking   control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" =  2.2 } }
                    { name = eq7_l type = builtin label = bq_peaking   control = { "Freq" = 4000.0 "Q" = 1.4 "Gain" = -0.5 } }
                    { name = eq8_l type = builtin label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" =  1.5 } }

                    # Right channel
                    { name = eq0_r type = builtin label = bq_peaking   control = { "Freq" = 32.0   "Q" = 1.0 "Gain" = -6.0 } }
                    { name = eq1_r type = builtin label = bq_peaking   control = { "Freq" = 64.0   "Q" = 1.0 "Gain" =  2.5 } }
                    { name = eq2_r type = builtin label = bq_peaking   control = { "Freq" = 125.0  "Q" = 1.1 "Gain" =  4.5 } }
                    { name = eq3_r type = builtin label = bq_peaking   control = { "Freq" = 250.0  "Q" = 1.2 "Gain" =  0.5 } }
                    { name = eq4_r type = builtin label = bq_peaking   control = { "Freq" = 500.0  "Q" = 1.2 "Gain" = -2.0 } }
                    { name = eq5_r type = builtin label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 1.2 "Gain" =  0.5 } }
                    { name = eq6_r type = builtin label = bq_peaking   control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" =  2.2 } }
                    { name = eq7_r type = builtin label = bq_peaking   control = { "Freq" = 4000.0 "Q" = 1.4 "Gain" = -0.5 } }
                    { name = eq8_r type = builtin label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" =  1.5 } }

                    # Calf Bass Enhancer (perceptible warm low-end harmonics on laptop speakers)
                    {
                        type   = lv2
                        name   = bass_enhancer
                        plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                        control = {
                            "bypass"       = 0
                            "level_in"     = 1.0
                            "level_out"    = 1.0
                            "amount"       = 1.65
                            "drive"        = 4.2
                            "blend"        = 0.0
                            "freq"         = 125.0
                            "listen"       = 0
                            "floor_active" = 1
                            "floor"        = 50.0
                        }
                    }

                    # LSP Limiter Stereo (Herm Wide = 1, -0.3 dB threshold = 0.966051)
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            "enabled" = 1
                            "mode"    = 1
                            "th"      = 0.966051
                            "lk"      = 2.0
                            "at"      = 1.0
                            "rt"      = 10.0
                            "alr"     = 0
                            "boost"   = 0
                            "ovs"     = 0
                        }
                    }
                ]
                links = [
                    { output = "preamp_l:Out" input = "eq0_l:In" }
                    { output = "eq0_l:Out"    input = "eq1_l:In" }
                    { output = "eq1_l:Out"    input = "eq2_l:In" }
                    { output = "eq2_l:Out"    input = "eq3_l:In" }
                    { output = "eq3_l:Out"    input = "eq4_l:In" }
                    { output = "eq4_l:Out"    input = "eq5_l:In" }
                    { output = "eq5_l:Out"    input = "eq6_l:In" }
                    { output = "eq6_l:Out"    input = "eq7_l:In" }
                    { output = "eq7_l:Out"    input = "eq8_l:In" }
                    { output = "eq8_l:Out"    input = "bass_enhancer:in_l" }

                    { output = "preamp_r:Out" input = "eq0_r:In" }
                    { output = "eq0_r:Out"    input = "eq1_r:In" }
                    { output = "eq1_r:Out"    input = "eq2_r:In" }
                    { output = "eq2_r:Out"    input = "eq3_r:In" }
                    { output = "eq3_r:Out"    input = "eq4_r:In" }
                    { output = "eq4_r:Out"    input = "eq5_r:In" }
                    { output = "eq5_r:Out"    input = "eq6_r:In" }
                    { output = "eq6_r:Out"    input = "eq7_r:In" }
                    { output = "eq7_r:Out"    input = "eq8_r:In" }
                    { output = "eq8_r:Out"    input = "bass_enhancer:in_r" }

                    { output = "bass_enhancer:out_l" input = "limiter:in_l" }
                    { output = "bass_enhancer:out_r" input = "limiter:in_r" }
                ]
                inputs  = [ "preamp_l:In 1" "preamp_r:In 1" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.harman_kardon"
                media.class      = "Audio/Sink"
                priority.session = 1100
            }
            playback.props = {
                node.name     = "effect_output.harman_kardon"
                target.object = "alsa_output.pci-0000_03_00.6.HiFi__Speaker__sink"
                node.passive  = true
            }
        }
    }
]
