# Commands and Apps to be executed at launch

# Start virtual keyboard daemon on-demand (spawned automatically by TouchRotate.sh in tablet mode)
# exec-once = bash -c '[ ! -f "$HOME/.cache/virtual_keyboard_disabled" ] && sleep 3 && $HOME/.local/bin/wvkbd-mobintl -L 300 -H 350 --hidden'

# Quickshell Overview Daemon (Disabled to save ~260MB RAM)
# exec-once = qs -c overview -d

# Turn off Bluetooth on startup
exec-once = bluetoothctl power off

# Pinch-to-Zoom daemon (2-finger pinch → cursor:zoom_factor via hyprctl)
exec-once = sleep 3 && python3 $HOME/.config/hypr/UserScripts/PinchZoom.py
