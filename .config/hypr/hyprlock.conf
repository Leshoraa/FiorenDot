# --- INPUT FIELD (Modern Pill Shape) ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    
    # Memakai warna putih dominan Wallust untuk outline
    outer_color = $color15
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $color15
    
    fade_on_empty = true 
    placeholder_text = .                   Enter Yo Pass Nega                   .
    hide_input = false
    rounding = 20
    
    check_color = $color10
    fail_color = $color9
    fail_transition = 200 
    
    position = 0, -120
    halign = center
    valign = center
}

