// Author: Fioren (@Leshoraa) — Zen Browser live Wallust CSS hot-reloader
// Note: First line must remain a JS comment for Mozilla AutoConfig.

var __zenWallustState = {
  timer: null,
  activeUri: null,
  lastMtime: -1,
};

(function () {
  try {
    if (typeof Services === "undefined" || typeof Cc === "undefined" || typeof Ci === "undefined") {
      return;
    }

    var sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    var initialized = false;

    function getSheetFile() {
      var file = Services.dirsvc.get("ProfD", Ci.nsIFile);
      file.append("chrome");
      file.append("wallust-zen.css");
      return file;
    }

    function syncSheet() {
      try {
        var file = getSheetFile().clone();
        if (!file.exists()) {
          return;
        }
        var mtime = file.lastModifiedTime;
        if (!mtime || mtime === __zenWallustState.lastMtime) {
          return;
        }

        var oldUri = __zenWallustState.activeUri;
        var baseSpec = Services.io.newFileURI(file).spec;
        var newUri = Services.io.newURI(baseSpec + "?v=" + mtime);

        if (oldUri && sss.sheetRegistered(oldUri, sss.USER_SHEET)) {
          sss.unregisterSheet(oldUri, sss.USER_SHEET);
        }
        if (!sss.sheetRegistered(newUri, sss.USER_SHEET)) {
          sss.loadAndRegisterSheet(newUri, sss.USER_SHEET);
        }

        __zenWallustState.activeUri = newUri;
        __zenWallustState.lastMtime = mtime;
      } catch (e) {}
    }

    var observer = {
      observe: function (_subject, topic) {
        if (topic === "browser-delayed-startup-finished") {
          if (initialized) {
            return;
          }
          initialized = true;
          syncSheet();
          if (!__zenWallustState.timer) {
            __zenWallustState.timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
            __zenWallustState.timer.initWithCallback(
              { notify: syncSheet },
              400,
              Ci.nsITimer.TYPE_REPEATING_SLACK
            );
          }
        } else if (topic === "quit-application") {
          if (__zenWallustState.timer) {
            __zenWallustState.timer.cancel();
            __zenWallustState.timer = null;
          }
          try {
            Services.obs.removeObserver(observer, "browser-delayed-startup-finished");
            Services.obs.removeObserver(observer, "quit-application");
          } catch (e) {}
        }
      },
    };

    Services.obs.addObserver(observer, "browser-delayed-startup-finished", false);
    Services.obs.addObserver(observer, "quit-application", false);
  } catch (e) {}
})();
